# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# The database comes from Neon (free Postgres); paste its connection string into DATABASE_URL when asked.
services:
  - type: web
    name: securechat-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_TYPE
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: DB_SYNC
        value: "true"
      # Shows login codes in the app until an SMS provider is added.
      - key: EXPOSE_OTP
        value: "true"
